<!--
  Пример YML-фида, адаптированного под Яндекс Маркет, с выдуманными товарами.

  Соответствие требуемых атрибутов тегам YML для Яндекс Маркета:
    - название товара         -> <name>
    - категория                -> <categoryId> (справочник категорий ниже)
    - артикул продавца         -> <vendorCode>
    - бренд                    -> <vendor>
    - код ТН ВЭД               -> <tn-ved-code>
    - 6 ссылок на изображения  -> шесть тегов <picture> (Маркет принимает до 10 картинок на офер)
    - габариты упаковки        -> <dimensions>Ш x Д x В</dimensions>, в сантиметрах,
                                   порядок: ширина x длина x высота, разделитель "x"
    - вес в граммах            -> <weight>, но у Яндекса это ЕДИНИЦА ИЗМЕРЕНИЯ - КИЛОГРАММЫ,
                                   поэтому граммы из исходных данных пересчитаны в кг
                                   (320 г -> 0.32)
    - остаток на складе        -> <count>
    - текущая цена продажи     -> <price>
    - старая цена продажи      -> <oldprice> (Маркет показывает её как зачёркнутую/скидку)
    - НДС 22% для всех товаров -> <vat>VAT_22</vat>

  ВАЖНО: с 15 июня 2026 года Яндекс Маркет требует обязательно указывать вес и габариты
  товара в упаковке для всех офферов (минимум 0.1 см / 0.001 кг). В этом примере габариты
  и вес переданы через теги <dimensions> и <weight>, как это принято в YML-модулях
  выгрузки на Маркет (1С-Битрикс, InSales и др.). Перед боевой выгрузкой обязательно
  сверьте актуальные требования в личном кабинете Яндекс Маркета и валидатором фида,
  так как форматы отдельных полей периодически уточняются площадкой.
-->
